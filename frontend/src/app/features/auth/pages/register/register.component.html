<div class="min-h-screen flex items-center justify-center bg-[#F1F5F9] px-6 antialiased">
  <div
    class="w-full max-w-[400px] bg-white p-8 lg:p-10 rounded-2xl shadow-xl shadow-slate-200 border border-slate-100">

    <header class="text-center mb-6 space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-50 border border-indigo-100">
        <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v10.5a2.25 2.25 0 0 1-2.25 2.25H7.5a2.25 2.25 0 0 1-2.25-2.25V7.5m14.25 0v-1.125a2.25 2.25 0 0 0-2.25-2.25H8.625a2.25 2.25 0 0 0-2.25 2.25V7.5m14.25 0L12 11.25 3.75 7.5" />
        </svg>
      </div>
      <h1 class="text-2xl font-black text-[#1C2434] tracking-tight">Nueva cuenta</h1>
      <p class="text-slate-500 font-medium text-xs">Únete a la plataforma VehiAssist</p>
    </header>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-3.5">

      <div class="grid grid-cols-2 gap-3">
        <app-auth-input
          label="Nombre"
          placeholder="Eva"
          [control]="$any(registerForm.controls.nombre)"
        ></app-auth-input>
        <app-auth-input
          label="Apellido"
          placeholder="Master"
          [control]="$any(registerForm.controls.apellido)"
        ></app-auth-input>
      </div>

      <app-auth-input
        label="Correo electrónico"
        placeholder="ejemplo@email.com"
        type="email"
        [control]="$any(registerForm.controls.email)"
        icon='<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" /></svg>'
      ></app-auth-input>

      <app-auth-input
        label="Contraseña"
        placeholder="••••••••"
        type="password"
        [control]="$any(registerForm.controls.password)"
        icon='<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" /></svg>'
      ></app-auth-input>

      <app-primary-button
        type="submit"
        [disabled]="registerForm.invalid"
        [showArrow]="true"
      >
        Crear cuenta
      </app-primary-button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 text-center">
      <p class="text-slate-600 font-medium text-xs">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="text-indigo-600 font-bold hover:text-indigo-700 transition-colors">Inicia sesión</a>
      </p>
    </div>

  </div>
</div>
