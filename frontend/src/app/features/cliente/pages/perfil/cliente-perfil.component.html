<div class="space-y-6">
  <div class="rounded-2xl border border-slate-200  bg-white  p-6">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h1 class="text-xl font-extrabold text-slate-900 ">Mi perfil</h1>
        <p class="mt-1 text-sm text-slate-500 ">
          En la web, el cliente solo gestiona su perfil y visualiza su JWT.
        </p>
      </div>

      <button
        type="button"
        (click)="copyToken()"
        class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold hover:bg-indigo-700 active:scale-[0.99] transition"
      >
        Copiar JWT
      </button>
    </div>
  </div>

  <div class="rounded-2xl border border-slate-200  bg-white  p-6">
    <div class="text-sm font-extrabold text-slate-900 ">Token JWT</div>
    <p class="mt-1 text-[12px] text-slate-500 ">
      Este token se usa como Bearer Token para consumir la API.
    </p>

    <pre class="mt-4 whitespace-pre-wrap break-words rounded-xl bg-slate-950 text-slate-100 p-4 text-[12px] leading-relaxed border border-slate-800">{{ token() }}</pre>
  </div>

  <div class="rounded-2xl border border-slate-200  bg-white  p-6">
    <div class="text-sm font-extrabold text-slate-900 ">Payload decodificado (debug)</div>
    <pre class="mt-4 whitespace-pre-wrap break-words rounded-xl bg-slate-50  text-slate-800  p-4 text-[12px] border border-slate-200 ">{{ decoded() | json }}</pre>
  </div>
</div>
