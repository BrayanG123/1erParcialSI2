<div class="h-full flex flex-col rounded-2xl border border-gray-200 bg-white   overflow-hidden">
  
  <div class="p-5 sm:p-6 flex flex-col flex-grow">
    <div class="flex justify-between items-start mb-6">
      <div>
        <h3 class="text-lg font-bold text-gray-800  uppercase tracking-tight">
          Objetivo Mensual
        </h3>
        <p class="mt-1 text-gray-500 text-xs ">
          Meta establecida para cada mes
        </p>
      </div>
      
      <div class="relative inline-block">
        <button class="p-1 rounded-lg hover:bg-gray-100 :bg-white/5 transition-colors" (click)="toggleDropdown()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="text-gray-400 size-6"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.2441 6C10.2441 5.0335 11.0276 4.25 11.9941 4.25H12.0041C12.9706 4.25 13.7541 5.0335 13.7541 6C13.7541 6.9665 12.9706 7.75 12.0041 7.75H11.9941C11.0276 7.75 10.2441 6.9665 10.2441 6ZM10.2441 18C10.2441 17.0335 11.0276 16.25 11.9941 16.25H12.0041C12.9706 16.25 13.7541 17.0335 13.7541 18C13.7541 18.9665 12.9706 19.75 12.0041 19.75H11.9941C11.0276 19.75 10.2441 18.9665 10.2441 18ZM11.9941 10.25C11.0276 10.25 10.2441 11.0335 10.2441 12C10.2441 12.9665 11.0276 13.75 11.9941 13.75H12.0041C12.9706 13.75 13.7541 12.9665 13.7541 12C13.7541 11.0335 12.9706 10.25 12.0041 10.25H11.9941Z" fill="currentColor"></path></svg>
        </button>
        <app-dropdown [isOpen]="isOpen" (close)="closeDropdown()" className="w-40 p-2">
          <app-dropdown-item (itemClick)="closeDropdown()" className="flex w-full font-normal text-left text-gray-500 rounded-lg hover:bg-gray-100 hover:text-gray-700  :bg-white/5 :text-gray-300">View More</app-dropdown-item>
          <app-dropdown-item (itemClick)="closeDropdown()" className="flex w-full font-normal text-left text-gray-500 rounded-lg hover:bg-gray-100 hover:text-gray-700  :bg-white/5 :text-gray-300">Delete</app-dropdown-item>
        </app-dropdown>
      </div>
    </div>

    <div class="flex justify-center mb-6">
      <span class="rounded-full bg-green-500/10 px-4 py-1.5 text-xs font-bold text-green-500 border border-green-500/20">
        +10%
      </span>
    </div>

    <div class="flex-grow flex items-center justify-center">
      <p class="text-center text-sm sm:text-base text-gray-500  leading-relaxed max-w-[280px]">
        Has ganado <span class="text-blue-500 font-bold">$3,287</span> hoy, es superior al mes pasado. <span class="block mt-1">¡Sigue así! 🚀</span>
      </p>
    </div>
  </div>

  <div class="flex items-center justify-around border-t border-gray-100  bg-gray-50/50  py-5 px-4">
    <div class="text-center">
      <p class="mb-1 text-[10px] font-bold uppercase tracking-wider text-gray-400">Objetivo</p>
      <p class="flex items-center justify-center gap-1 text-sm font-black ">$20K</p>
    </div>
    <div class="w-px bg-gray-200 h-8 "></div>
    <div class="text-center">
      <p class="mb-1 text-[10px] font-bold uppercase tracking-wider text-gray-400">Ingresos</p>
      <p class="flex items-center justify-center gap-1 text-sm font-black text-blue-500">$20K</p>
    </div>
    <div class="w-px bg-gray-200 h-8 "></div>
    <div class="text-center">
      <p class="mb-1 text-[10px] font-bold uppercase tracking-wider text-gray-400">Hoy</p>
      <p class="flex items-center justify-center gap-1 text-sm font-black ">$20K</p>
    </div>
  </div>
</div>
