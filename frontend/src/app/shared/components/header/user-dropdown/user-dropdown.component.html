<div class="relative">
  <button (click)="toggleDropdown()" class="flex items-center text-gray-700 dropdown-toggle  group">
    <span
      class="mr-3 overflow-hidden rounded-full h-11 w-11 bg-brand-500 flex items-center justify-center text-white font-bold shadow-md">
      {{ userName.charAt(0).toUpperCase() }}
    </span>
    <span class="block mr-1 font-medium text-theme-sm ">{{ userName }}</span>
    <svg [ngClass]="{'rotate-180': isOpen}" class="transition-transform duration-200" width="18" height="20"
      viewBox="0 0 18 20" fill="none">
      <path d="M4.3125 8.65625L9 13.3437L13.6875 8.65625" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <app-dropdown [isOpen]="isOpen" (close)="closeDropdown()"
    className="absolute right-0 mt-[17px] flex w-[260px] flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg  ">

    <div class="px-3 py-2 border-b border-gray-200 ">
      <span class="block font-medium text-gray-800 text-theme-sm ">
        {{ userName }}
      </span>

      <span [ngClass]="{
      'bg-purple-100 text-purple-700  ': userRole === 'superadmin',
      'bg-blue-100 text-blue-700  ': userRole === 'administrador'
    }" class="mt-1.5 inline-block px-2 py-0.5 text-[10px] font-bold uppercase rounded-md tracking-wider">
        {{ userRole }}
      </span>
    </div>

    <ul class="flex flex-col gap-1 pt-4 pb-3 border-b border-gray-200 ">
      <li>
        <app-dropdown-item-two (itemClick)="closeDropdown()" tag="a" [to]="userRole === 'superadmin' ? '/superadmin/perfil' : (userRole === 'administrador' ? '/admin/dashboard' : '/cliente/perfil')"
          className="flex items-center gap-3 px-3 py-2 font-medium text-gray-700 rounded-lg group text-theme-sm hover:bg-gray-100  :bg-white/5">
          <svg class="size-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          Editar perfil
        </app-dropdown-item-two>
      </li>
      <li>
        <app-dropdown-item-two (itemClick)="closeDropdown()" tag="a" [to]="'/settings'"
          className="flex items-center gap-3 px-3 py-2 font-medium text-gray-700 rounded-lg group text-theme-sm hover:bg-gray-100  :bg-white/5">
          <svg class="size-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Configuración de la cuenta
        </app-dropdown-item-two>
      </li>
    </ul>

    <button (click)="logout()"
      class="flex items-center gap-3 px-3 py-3 mt-1 font-medium text-gray-700 rounded-lg group text-theme-sm hover:bg-gray-100  :bg-white/5 transition-colors">
      <svg class="size-5 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      Desconectarse
    </button>
  </app-dropdown>
</div>
