# Configuración de nginx para servir la app Angular (SPA + PWA)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip: las descargas pesan ~70% menos
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # CLAVE para Angular: si la URL no es un archivo real
    # (ej: /admin/dashboard), devolver index.html y que el
    # router de Angular resuelva la ruta. Sin esto, recargar
    # la página (F5) daría error 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El Service Worker (PWA) no debe cachearse en el navegador:
    # siempre debe poder detectar versiones nuevas de la app
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }

    # Archivos con hash en el nombre (main-XYZ123.js): caché larga
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
